name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [feature/docker-ci, dev, staging, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, tests and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check code
        run: python -m ruff check app ml tests

      - name: Check formatting
        run: python -m ruff format --check app ml tests

      - name: Run full test suite
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build -t digit-classification-mlops:ci .
